name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Installer
        run: |
          bash -n install.sh
          bash install.sh --help >/dev/null
          bash install.sh --print-target >/dev/null
          bash install.sh --dry-run >/dev/null

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        env:
          # Force console-crate ANSI emission so attribute leaks on
          # color-disabled paths can't be silently neutered by GitHub
          # Actions' non-TTY detection. This mirrors what Nix build
          # sandboxes see and caught once.
          CLICOLOR_FORCE: 1
        run: cargo test

      - name: Build
        run: cargo build --release

  nix-home-manager-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Home Manager module smoke test
        run: bash scripts/test-home-manager-module.sh
