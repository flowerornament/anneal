[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "Read-only development instruments for the anneal workspace"
publish = false

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
elided_lifetimes_in_paths = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
redundant_clone = "deny"
use_self = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
similar_names = "allow"
items_after_statements = "allow"
struct_excessive_bools = "allow"

[dependencies]
atlas-core = { git = "https://github.com/flowerornament/atlas", rev = "513aebb3d521b9a0785813bb3a55213c44bb4077", version = "0.1.1" }
cargo_metadata = "0.23.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
